<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of an office network: the internet line enters a router with firewall, which connects to a core switch. The switch links office computers, a printer, Wi-Fi access points on each floor and the CCTV recorder over structured Cat6 cabling.">
  <rect width="700" height="360" fill="#FCFCFA"/>
  <text x="30" y="34" font-family="monospace" font-size="13" letter-spacing="1.5" fill="#0B7A65">HOW A WELL-BUILT OFFICE NETWORK LOOKS</text>
  <line x1="30" y1="48" x2="670" y2="48" stroke="#16211F" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#16211F">
    <rect x="40" y="150" width="100" height="44" rx="22" fill="#FFFFFF" stroke="#66716D" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="90" y="177" text-anchor="middle" font-weight="600">Internet</text>
    <line x1="140" y1="172" x2="180" y2="172" stroke="#16211F" stroke-width="2.5"/>
    <rect x="180" y="145" width="120" height="54" rx="10" fill="#FFF0E6" stroke="#D9560C" stroke-width="2"/>
    <text x="240" y="168" text-anchor="middle" font-weight="600">Router</text>
    <text x="240" y="185" text-anchor="middle" font-size="11" fill="#4A5A50">+ firewall</text>
    <line x1="300" y1="172" x2="340" y2="172" stroke="#16211F" stroke-width="2.5"/>
    <rect x="340" y="145" width="120" height="54" rx="10" fill="#E3F1E7" stroke="#0E5C3A" stroke-width="2"/>
    <text x="400" y="168" text-anchor="middle" font-weight="600">Core switch</text>
    <text x="400" y="185" text-anchor="middle" font-size="11" fill="#4A5A50">in a network rack</text>
    <g stroke="#0B7A65" stroke-width="2.5" fill="none">
      <path d="M460 160 C500 160 500 85 540 85"/><path d="M460 168 C505 168 505 140 540 140"/>
      <path d="M460 178 C505 178 505 205 540 205"/><path d="M460 186 C500 186 500 262 540 262"/>
    </g>
    <g fill="#FFFFFF" stroke="#16211F" stroke-width="2">
      <rect x="540" y="66" width="130" height="38" rx="8"/><rect x="540" y="121" width="130" height="38" rx="8"/>
      <rect x="540" y="186" width="130" height="38" rx="8"/><rect x="540" y="243" width="130" height="38" rx="8"/>
    </g>
    <text x="605" y="90" text-anchor="middle">Wi-Fi access points</text>
    <text x="605" y="145" text-anchor="middle">Office computers</text>
    <text x="605" y="210" text-anchor="middle">Printers</text>
    <text x="605" y="267" text-anchor="middle">CCTV recorder</text>
    <text x="400" y="240" text-anchor="middle" fill="#0B7A65" font-size="11">structured Cat6 cabling, labelled at both ends</text>
    <text x="400" y="320" text-anchor="middle" fill="#66716D" font-size="11">One clean path for every device: faster, more secure and easy to troubleshoot.</text>
  </g>
</svg>
