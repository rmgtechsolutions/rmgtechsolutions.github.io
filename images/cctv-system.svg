<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of an IP CCTV system: four IP cameras connect over network cable to a PoE switch, which powers them and links to an NVR recorder with a hard disk. The NVR shows live video on a monitor and sends it through the router to the owner's phone app.">
  <rect width="700" height="380" fill="#FCFCFA"/>
  <text x="30" y="34" font-family="monospace" font-size="13" letter-spacing="1.5" fill="#0B7A65">HOW AN IP CCTV SYSTEM WORKS</text>
  <line x1="30" y1="48" x2="670" y2="48" stroke="#16211F" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#16211F">
    <!-- cameras -->
    <g stroke="#16211F" stroke-width="2" fill="#FFFFFF">
      <rect x="40" y="78" width="70" height="30" rx="8"/><rect x="40" y="138" width="70" height="30" rx="8"/>
      <rect x="40" y="198" width="70" height="30" rx="8"/><rect x="40" y="258" width="70" height="30" rx="8"/>
    </g>
    <g fill="#F26A1B"><circle cx="96" cy="93" r="7"/><circle cx="96" cy="153" r="7"/><circle cx="96" cy="213" r="7"/><circle cx="96" cy="273" r="7"/></g>
    <text x="75" y="312" text-anchor="middle" font-weight="600">IP cameras</text>
    <text x="75" y="328" text-anchor="middle" fill="#66716D" font-size="11">2MP / 4MP · IR night vision</text>
    <!-- cables to switch -->
    <g stroke="#0B7A65" stroke-width="2.5" fill="none">
      <path d="M110 93 H160 V170 H215"/><path d="M110 153 H160"/><path d="M110 213 H160 V180 H215"/><path d="M110 273 H160 V190"/>
    </g>
    <text x="163" y="70" fill="#0B7A65" font-size="11">one Cat6 cable each:</text>
    <text x="163" y="84" fill="#0B7A65" font-size="11">video + power (PoE)</text>
    <!-- switch -->
    <rect x="215" y="155" width="120" height="50" rx="10" fill="#E3F1E7" stroke="#0E5C3A" stroke-width="2"/>
    <text x="275" y="178" text-anchor="middle" font-weight="600">PoE switch</text>
    <text x="275" y="194" text-anchor="middle" font-size="11" fill="#4A5A50">powers the cameras</text>
    <line x1="335" y1="180" x2="390" y2="180" stroke="#16211F" stroke-width="2.5"/>
    <!-- NVR -->
    <rect x="390" y="150" width="130" height="60" rx="10" fill="#FFF0E6" stroke="#D9560C" stroke-width="2"/>
    <text x="455" y="175" text-anchor="middle" font-weight="600">NVR recorder</text>
    <text x="455" y="192" text-anchor="middle" font-size="11" fill="#4A5A50">+ surveillance HDD</text>
    <text x="455" y="232" text-anchor="middle" font-size="11" fill="#66716D">stores 15–30 days</text>
    <!-- monitor -->
    <line x1="520" y1="168" x2="575" y2="110" stroke="#16211F" stroke-width="2"/>
    <rect x="575" y="80" width="90" height="56" rx="6" fill="#FFFFFF" stroke="#16211F" stroke-width="2"/>
    <text x="620" y="113" text-anchor="middle" font-size="11">live view</text>
    <text x="620" y="156" text-anchor="middle" font-weight="600">Monitor</text>
    <!-- router / phone -->
    <line x1="520" y1="195" x2="575" y2="250" stroke="#16211F" stroke-width="2"/>
    <rect x="575" y="232" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#16211F" stroke-width="2"/>
    <text x="620" y="257" text-anchor="middle" font-size="11">router</text>
    <line x1="620" y1="272" x2="620" y2="296" stroke="#16211F" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="603" y="296" width="34" height="54" rx="7" fill="#FFFFFF" stroke="#F26A1B" stroke-width="2"/>
    <text x="590" y="370" text-anchor="end" font-weight="600">Phone app</text>
  </g>
</svg>
